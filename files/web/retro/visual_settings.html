<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Visuals | Stargate Command</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/retro_visuals.css" />
    <link rel="stylesheet" href="css/visual_settings.css" />
  </head>
  <body>
    <main class="visual-settings">
      <h1>Retro Visuals</h1>
      <div class="visual-grid">
        <form id="retro-visuals-form" class="visual-form">
          <div class="visual-field">
            <label for="background-mode">Background</label>
            <select id="background-mode">
              <option value="default">Default</option>
              <option value="custom">Custom image</option>
            </select>
          </div>
          <div class="visual-field visual-field-wide">
            <label for="background-file">Custom image</label>
            <div class="visual-file-control">
              <input id="background-file" type="file" accept="image/*" />
              <label class="visual-file-button" for="background-file">Choose image</label>
              <span id="background-file-name" class="visual-file-name">No file selected</span>
            </div>
          </div>
          <div class="visual-field visual-field-hidden">
            <label for="saved-background">Saved backgrounds</label>
            <select id="saved-background">
              <option value="">Upload or current</option>
            </select>
          </div>
          <div id="saved-background-preview" class="visual-background-list" aria-live="polite"></div>
          <div class="visual-field">
            <label for="incoming-style">Incoming call</label>
            <select id="incoming-style">
              <option value="classic">Classic</option>
              <option value="enhanced">Enhanced</option>
            </select>
          </div>
          <div class="visual-field">
            <span class="visual-label">Incoming symbols</span>
            <label class="visual-inline">
              <input id="incoming-symbols-in-boxes" type="checkbox" />
              <span>Symbols in boxes</span>
            </label>
          </div>
          <div class="visual-field">
            <span class="visual-label">Symbol glow</span>
            <label class="visual-inline">
              <input id="glow-enabled" type="checkbox" />
              <span>Enabled</span>
            </label>
          </div>
          <div class="visual-field">
            <label for="glow-color">Glow color</label>
            <input id="glow-color" type="color" value="#fffea5" />
          </div>
          <div class="visual-field">
            <label for="glow-intensity">Glow intensity</label>
            <div class="visual-inline">
              <input id="glow-intensity" type="range" min="0" max="80" value="12" />
              <output id="glow-intensity-value">12</output>
            </div>
          </div>
          <div class="visual-field">
            <span class="visual-label">Custom colors</span>
            <label class="visual-inline">
              <input id="custom-colors-enabled" type="checkbox" />
              <span>Enabled</span>
            </label>
          </div>
          <div class="visual-field">
            <label for="dialed-symbol-color">Dialed symbols</label>
            <input id="dialed-symbol-color" type="color" value="#fffea5" />
          </div>
          <div class="visual-field">
            <label for="ring-symbol-color">Ring symbols</label>
            <input id="ring-symbol-color" type="color" value="#fffea5" />
          </div>
          <div class="visual-field">
            <label for="keyboard-symbol-color">Selection symbols</label>
            <input id="keyboard-symbol-color" type="color" value="#fffea5" />
          </div>
          <div class="visual-field">
            <label for="gate-name-color">Gate name</label>
            <input id="gate-name-color" type="color" value="#78dcff" />
          </div>
          <div class="visual-field">
            <label for="ui-line-color">Main UI lines</label>
            <input id="ui-line-color" type="color" value="#37bfde" />
          </div>
          <div class="visual-field">
            <label for="ui-secondary-color">Secondary UI lines</label>
            <input id="ui-secondary-color" type="color" value="#4a7297" />
          </div>
          <div class="visual-field">
            <span class="visual-label">Change all UI</span>
            <label class="visual-inline">
              <input id="change-all-ui-colors" type="checkbox" />
              <span>Include top menu</span>
            </label>
          </div>
          <div class="visual-actions visual-actions-secondary">
            <button id="restore-original-colors" type="button">Restore original colors</button>
          </div>
          <div class="visual-actions">
            <button type="submit">Save</button>
          </div>
          <div class="visual-message" role="status"></div>
        </form>
        <section class="visual-preview">
          <iframe id="visual-preview-frame" title="Retro preview" src="visual_preview.html"></iframe>
        </section>
      </div>
    </main>
    <script src="js/retro_visuals.js"></script>
    <script type="module" src="js/navigation.js"></script>
    <script type="module" src="js/visual_settings.js"></script>
  </body>
</html>
